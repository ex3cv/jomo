name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: docker
    container:
      image: node:24-alpine
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Install XML validation tool
        run: |
          apk update
          apk add --no-cache libxml2-utils make zip unzip
      - name: Validate
        run: make check
